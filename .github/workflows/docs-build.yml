name: Build and deploy documentation

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 * * * *"
  repository_dispatch:
    types:
      - docs-updated
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website repository
        uses: actions/checkout@v6

      - name: Check out documentation source
        uses: actions/checkout@v6
        with:
          repository: ZerothRobot/zerothrobot-docs
          ref: ${{ github.event.client_payload.ref || 'main' }}
          path: docs-source

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs-source/requirements.txt

      - name: Install documentation dependencies
        run: python -m pip install -r docs-source/requirements.txt

      - name: Build site and validate links
        run: mkdocs build --strict --config-file docs-source/mkdocs.yml --site-dir "$GITHUB_WORKSPACE/public/docs"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
