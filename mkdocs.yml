site_name: ZerothRobot 文档中心
site_description: ZerothRobot 产品与开发文档
site_url: https://zerothrobot.github.io/docs/
site_dir: public/docs
repo_url: https://github.com/ZerothRobot/ZerothRobot.github.io
repo_name: ZerothRobot/ZerothRobot.github.io
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.action.edit
  palette:
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - 首页: index.md
  - 快速开始:
      - 概览: getting-started/index.md
  - 产品与使用:
      - 产品概览: guides/index.md
  - 开发参考:
      - 概览: development/index.md
  - 常见问题: faq.md

strict: true
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
